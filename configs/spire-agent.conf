agent {
    data_dir = "./data/spire-agent"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = 8081
    trust_domain = "omnimesh.local"
    insecure_bootstrap = true
    
    experimental {
        named_pipe_name = "\\spire-agent\\public\\api"
    }
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    
    KeyManager "disk" {
        plugin_data {
            directory = "./data/spire-agent"
        }
    }
    
    WorkloadAttestor "windows" {
        plugin_data {
            discover_workload_path = true
        }
    }
}
