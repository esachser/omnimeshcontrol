# Production SPIRE Agent Configuration
# Disables insecure bootstrap and enforces strict attestation validation.

agent {
    data_dir = "/srv/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server.internal"
    server_port = 8081
    trust_domain = "omnimesh.local"
    
    # Enforce secure bootstrapping using pre-distributed server trust bundle
    insecure_bootstrap = false
    trust_bundle_path = "/srv/spire/certs/server-trust-bundle.crt"

    # Unix domain socket configuration for Linux nodes
    socket_path = "/var/run/spire/sockets/agent.sock"

    # Named pipe configuration for Windows nodes
    experimental {
        named_pipe_name = "\\spire-agent\\public\\api"
    }
}

plugins {
	# Secure Node Attestor matching the server config
	NodeAttestor "x509pop" {
		plugin_data {
			private_key_path = "/srv/spire/certs/node-agent.key"
			certificate_path = "/srv/spire/certs/node-agent.crt"
		}
	}

	# Alternative Cloud Node Attestors (uncomment for target environment):
	# NodeAttestor "aws_iid" {
	# 	plugin_data {}
	# }
	# NodeAttestor "gcp_iit" {
	# 	plugin_data {}
	# }

	KeyManager "disk" {
		plugin_data {
			directory = "/srv/spire/data/agent"
		}
	}

	# Secure Workload Attestor for Linux (Process-level details)
	WorkloadAttestor "unix" {
		plugin_data {
			# Enables unix-specific attributes (uid, gid, path)
		}
	}

	# Secure Workload Attestor for Windows (if deploying on Windows agents)
	WorkloadAttestor "windows" {
		plugin_data {
			# Enables Windows process attestation
		}
	}
}
