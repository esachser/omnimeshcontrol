server {
    bind_address = "127.0.0.1"
    bind_port = 8081
    trust_domain = "omnimesh.local"
    data_dir = "./data/spire-server"
    log_level = "INFO"

    ca_key_type = "rsa-2048"

    ca_subject {
        country = ["BR"]
        organization = ["Omnimesh"]
        common_name = "Omnimesh Root CA"
    }

    experimental {
        named_pipe_name = "\\spire-server\\private\\api"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "./data/spire-server/datastore.sqlite3"
        }
    }
    
    NodeAttestor "join_token" {
        plugin_data {}
    }
    
    KeyManager "disk" {
        plugin_data {
            keys_path = "./data/spire-server/keys.json"
        }
    }
}
