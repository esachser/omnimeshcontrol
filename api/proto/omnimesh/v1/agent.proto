syntax = "proto3";

package omnimesh.v1;

option go_package = "github.com/esachser/omnimeshcontrol/api/gen/omnimesh/v1;omnimeshv1";

// --- Agent Stream Service ---
// Bidirectional stream between agents and the control plane.
// Agent liveness is implicit from stream health (no heartbeat RPC).

service AgentService {
  // AgentStream is the persistent bidirectional stream.
  // Agent sends: registration, health reports, drain requests.
  // Control plane sends: scope snapshots, scope updates, route updates.
  rpc AgentStream(stream AgentStreamRequest) returns (stream AgentStreamResponse);
}

// --- Agent → Control Plane Messages ---

message AgentStreamRequest {
  oneof payload {
    RegisterNodeRequest register_node = 1;
    HealthReport health_report = 2;
    UpdateNodeServicesRequest update_node_services = 4;
    DrainNodeRequest drain_node = 5;
  }
}

message RegisterNodeRequest {
  string node_id = 1;
  string platform = 2; // "linux", "windows", "darwin"
  string addr = 3; // "host:port" for HBONE tunneling
  map<string, string> labels = 4;
  repeated NodeServiceInfo services = 5; // ServiceIDs in "namespace/name" format
  string target = 6; // NetworkTarget the agent belongs to
}

message HealthReport {
  string namespace = 1;
  string service_name = 2;
  string route_name = 3;
  EndpointHealthStatus status = 4;
  string probe_type = 5; // "TCP", "HTTP", "gRPC"
}

message UpdateNodeServicesRequest {
  repeated NodeServiceInfo added_services = 1; // ServiceIDs in "namespace/name" format
  repeated NodeServiceInfo removed_services = 2; // ServiceIDs in "namespace/name" format
}

message DrainNodeRequest {}

message NodeServiceInfo {
  string namespace = 1;
  string name = 2;
  string id = 3;
  map<string, string> labels = 4;
}

enum EndpointHealthStatus {
  ENDPOINT_HEALTH_STATUS_UNSPECIFIED = 0;
  ENDPOINT_HEALTH_STATUS_HEALTHY = 1;
  ENDPOINT_HEALTH_STATUS_UNHEALTHY = 2;
  ENDPOINT_HEALTH_STATUS_DRAINING = 3;
}

// --- Control Plane → Agent Messages ---

message AgentStreamResponse {
  oneof payload {
    ScopeSnapshot scope_snapshot = 1;
    ScopeUpdate scope_update = 2;
  }
}

message ScopeSnapshot {
  repeated ServiceInfo services = 1;
  repeated RouteInfo routes = 2;
  repeated TrafficPolicyInfo traffic_policies = 3;
  repeated AuthzPolicyInfo authz_policies = 4;
  repeated EndpointHealthInfo endpoint_health = 5;
}

message ScopeUpdate {
  ScopeUpdateType type = 1;
  repeated ServiceInfo services = 2;
  repeated RouteInfo routes = 3;
  repeated TrafficPolicyInfo traffic_policies = 4;
  repeated EndpointHealthInfo endpoint_health = 5;
}

enum ScopeUpdateType {
  SCOPE_UPDATE_TYPE_UNSPECIFIED = 0;
  SCOPE_UPDATE_TYPE_ADD = 1;
  SCOPE_UPDATE_TYPE_MODIFY = 2;
  SCOPE_UPDATE_TYPE_REMOVE = 3;
}

// --- Shared Info Messages ---

message ServiceInfo {
  string namespace = 1;
  string name = 2;
  string protocol = 3;
  string mesh_addr = 4;
  int32 port = 5;
}

message RouteInfo {
  string namespace = 1;
  string service_name = 2;
  repeated NodeEndpointInfo target_nodes = 3;
}

message NodeEndpointInfo {
  string node_id = 1;
  string addr = 2;
  string route_name = 3;
  string target = 4;
  string target_address = 5;
  map<string, string> labels = 6;
}

message TrafficPolicyInfo {
  string name = 1;
  string namespace = 2;
  string target_service_namespace = 3;
  string target_service_name = 4;
  RetryPolicyInfo retry = 5;
  CircuitBreakerPolicyInfo circuit_breaker = 6;
  RateLimitPolicyInfo rate_limiter = 7;
  LoadBalancerPolicyInfo load_balancer = 8;
  OutlierDetectionPolicyInfo outlier_detection = 9;
  repeated TrafficRouteInfo routes = 10;
}

message RetryPolicyInfo {
  int32 max_retries = 1;
  repeated string retry_on = 2;
  // backoff_base_ms is the initial backoff duration in milliseconds.
  int64 backoff_base_ms = 3;
  // backoff_max_ms is the maximum backoff duration in milliseconds.
  int64 backoff_max_ms = 4;
}

message CircuitBreakerPolicyInfo {
  int32 failure_threshold = 1;
  // failure_window_ms is the rolling failure-counting window in milliseconds.
  int64 failure_window_ms = 2;
  // half_open_after_ms is the time after which a tripped circuit transitions
  // to half-open, in milliseconds.
  int64 half_open_after_ms = 3;
}

enum RateLimitAction {
  RATE_LIMIT_ACTION_UNSPECIFIED = 0;
  RATE_LIMIT_ACTION_REJECT = 1;
  RATE_LIMIT_ACTION_QUEUE = 2;
}

message RateLimitPolicyInfo {
  int32 requests_per_second = 1;
  int32 burst_size = 2;
  int32 max_concurrent_requests = 3;
  RateLimitAction limit_exceeded_action = 4;
}

enum LoadBalancerAlgorithm {
  LOAD_BALANCER_ALGORITHM_UNSPECIFIED = 0;
  LOAD_BALANCER_ALGORITHM_WEIGHTED_ROUND_ROBIN = 1;
  LOAD_BALANCER_ALGORITHM_LEAST_CONNECTIONS = 2;
  LOAD_BALANCER_ALGORITHM_RANDOM = 3;
}

message LoadBalancerPolicyInfo {
  LoadBalancerAlgorithm algorithm = 1;
}

message OutlierDetectionPolicyInfo {
  // error_rate_threshold is the fraction of errors above which an endpoint is
  // ejected (e.g. 0.5 = 50%).
  double error_rate_threshold = 1;
  int32 min_reporting_agents = 2;
  // ejection_duration_ms is how long an endpoint stays ejected, in milliseconds.
  int64 ejection_duration_ms = 3;
  // max_ejection_percent is the maximum percentage of endpoints that can be
  // ejected simultaneously (0–100).
  double max_ejection_percent = 4;
}

message TrafficRouteDestinationInfo {
  // target is the NetworkTarget identifier; empty means any target.
  string target = 1;
  map<string, string> labels = 2;
}

message TrafficRouteInfo {
  TrafficRouteDestinationInfo destination = 1;
  int32 weight = 2;
}

message AuthzPolicyInfo {
  string name = 1;
  string namespace = 2;
  string action = 3;
  SelectorInfo source = 4;
  SelectorInfo destination = 5;
}

message SelectorInfo {
  string namespace = 1;
  string name = 2;
  map<string, string> labels = 3;
}

// EndpointHealthInfo carries health status for a specific service endpoint.
// Fields are aligned with HealthReport (agent→CP) naming.
// node_id allows agents to match health to the correct route target_node.
message EndpointHealthInfo {
  string namespace = 1;
  string service_name = 2;
  // endpoint_id is the host:port of the endpoint — matches HealthReport.endpoint_id.
  string route_name = 3;
  EndpointHealthStatus status = 4;
  // probe_type is the kind of health check used: "TCP", "HTTP", or "gRPC".
  string probe_type = 5;
  // node_id is the agent node that reported this health.
  string node_id = 6;
}
