# Production SPIRE Server Configuration
# Ensures high security, accountability, and reliability.

server {
    bind_address = "0.0.0.0"
    bind_port = 8081
    trust_domain = "omnimesh.local"
    data_dir = "/srv/spire/data/server"
    log_level = "INFO"

    # Upstream CA is recommended in prod so SPIRE is not a self-signed root CA.
    # Here we default to RSA 2048 for local signing, but root trust is governed externally.
    ca_key_type = "rsa-2048"
    ca_subject {
        country = ["BR"]
        organization = ["Omnimesh"]
        common_name = "Omnimesh Production CA"
    }

    # Audit logging for security and compliance (accountability)
    audit_log_enabled = true
}

plugins {
    # Production-grade database datastore (PostgreSQL) instead of dev SQLite
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            # connection_string should be secured and pass credentials via env variables or secrets
            connection_string = "postgresql://spire_admin:SECURE_PASSWORD_HERE@postgres-db.internal:5432/spire_db?sslmode=verify-full&sslrootcert=/srv/spire/certs/postgres-ca.crt"
        }
    }

    # Secure Node Attestor (x509pop) using certificate-based proof of possession
    # for physical/virtual nodes. Prevents token hijacking.
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/srv/spire/certs/node-ca-bundle.crt"
        }
    }
    
    # Alternative Cloud Node Attestors (uncomment as needed for target cloud deployment):
    # NodeAttestor "aws_iid" {
    #     plugin_data {
    #         # AWS Instance Identity Document attestation
    #         trust_domain = "omnimesh.local"
    #     }
    # }
    # NodeAttestor "gcp_iit" {
    #     plugin_data {
    #         # GCP Instance Identity Token attestation
    #         project_id_whitelist = ["omnimesh-production"]
    #     }
    # }

    # Production key manager stores keys securely.
    # While disk key manager is used below, in secure cloud environments,
    # KMS/Vault plugins should be preferred.
    KeyManager "disk" {
        plugin_data {
            keys_path = "/srv/spire/data/server/keys.json"
        }
    }
    
    # HashiCorp Vault KeyManager Example (Preferred for production secrets protection):
    # KeyManager "vault" {
    #     plugin_data {
    #         vault_addr = "https://vault.internal:8200"
    #         namespace = "spire"
    #         auth_method = "token"
    #         client_token = "VAULT_TOKEN"
    #     }
    # }

    # Upstream CA plugin to integrate with enterprise PKI
    # UpstreamCA "disk" {
    #     plugin_data {
    #         cert_path = "/srv/spire/certs/upstream-ca.crt"
    #         key_path  = "/srv/spire/certs/upstream-ca.key"
    #     }
    # }
}
