agent {
    data_dir = "./data/spire-agent"
    log_level = "INFO"
    server_address = "172.27.144.1"
    server_port = 8081
    trust_domain = "omnimesh.local"
    insecure_bootstrap = true

    # Unix domain socket for Workload API on Linux.
    # Matches omnimeshcontrol default: unix:///tmp/spire-agent/public/api.sock
    socket_path = "/tmp/spire-agent/public/api.sock"
    admin_socket_path = "/tmp/spire-agent/private/admin.sock"

    authorized_delegates = [
        "spiffe://omnimesh.local/ns/omnimesh-system/sa/omnimeshcontrol",
    ]
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "./data/spire-agent"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }

    # Optional Docker attestor if running workloads inside containers
    # WorkloadAttestor "docker" {
    #     plugin_data {}
    # }
}
